<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Telegram Member Adder onboarding preview</title>
  <desc id="desc">A consent-based onboarding preview for Telegram Member Adder showing contact review, eligible members, and invitation scheduling.</desc>
  <rect width="1200" height="675" fill="#f4f7fc"/>
  <rect x="72" y="60" width="1056" height="552" rx="24" fill="#ffffff" stroke="#d6deec"/>
  <rect x="72" y="60" width="1056" height="72" rx="24" fill="#12315c"/>
  <text x="118" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Telegram Member Adder</text>
  <text x="930" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#c9d6ea">v1.0.0</text>
  <rect x="116" y="168" width="360" height="392" rx="18" fill="#edf3ff"/>
  <text x="150" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#12315c">Contact review</text>
  <rect x="150" y="246" width="276" height="54" rx="12" fill="#ffffff" stroke="#d6deec"/>
  <text x="178" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Imported contacts</text>
  <rect x="150" y="322" width="276" height="54" rx="12" fill="#ffffff" stroke="#d6deec"/>
  <text x="178" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Eligibility checked</text>
  <rect x="150" y="424" width="276" height="44" rx="10" fill="#2f80ed"/>
  <text x="178" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Consent-based onboarding</text>
  <rect x="524" y="168" width="556" height="392" rx="18" fill="#ffffff" stroke="#d6deec"/>
  <text x="562" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#12315c">Invitation schedule</text>
  <rect x="562" y="250" width="188" height="120" rx="16" fill="#edf3ff"/>
  <text x="592" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Eligible</text>
  <text x="592" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#2f80ed">312</text>
  <rect x="792" y="250" width="188" height="120" rx="16" fill="#edf3ff"/>
  <text x="822" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Scheduled</text>
  <text x="822" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#36b37e">84</text>
  <line x1="562" y1="418" x2="1018" y2="418" stroke="#d6deec"/>
  <text x="562" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Duplicates removed</text>
  <text x="562" y="504" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4a5c77">Operator approval required</text>
</svg>
